[project]
name = "chan-archiver"
version = "0.1.0"
description = "Archive 4chan threads (JSON, HTML, images) and auto-watch catalogs by regex filters."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "David Mc Ken", email = "david.mcken@codepro.guru" }]
dependencies = ["requests>=2.28"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.scripts]
chan-archiver = "chan_archiver.cli:run"
chan = "chan_archiver.cli:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
